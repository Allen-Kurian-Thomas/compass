<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TechySpot Intern Monitoring System">
    <title>{% block title %}TechySpot IMS{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% if messages %}
    <div class="toast-container" id="toastContainer">
        {% for message in messages %}
        <div class="toast toast-{{ message.tags }}">
            <span>{{ message }}</span>
            <button class="toast-close" onclick="this.parentElement.remove()">×</button>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% block content %}{% endblock %}
    <script>
        setTimeout(() => {
            document.querySelectorAll('.toast').forEach(t => {
                t.style.opacity = '0';
                setTimeout(() => t.remove(), 400);
            });
        }, 5000);

        function togglePortalSidebar() {
            const sidebar = document.querySelector('.portal-sidebar');
            if (sidebar) {
                sidebar.classList.toggle('open');
                toggleBackdrop(sidebar);
            }
        }

        function toggleAdminSidebar() {
            const sidebar = document.querySelector('.admin-sidebar');
            if (sidebar) {
                sidebar.classList.toggle('open');
                toggleBackdrop(sidebar);
            }
        }

        function toggleBackdrop(sidebar) {
            let backdrop = document.getElementById('sidebar-backdrop');
            if (!backdrop) {
                backdrop = document.createElement('div');
                backdrop.id = 'sidebar-backdrop';
                backdrop.style.position = 'fixed';
                backdrop.style.top = '0';
                backdrop.style.left = '0';
                backdrop.style.right = '0';
                backdrop.style.bottom = '0';
                backdrop.style.backgroundColor = 'rgba(0, 0, 0, 0.4)';
                backdrop.style.backdropFilter = 'blur(2px)';
                backdrop.style.zIndex = '95';
                backdrop.style.opacity = '0';
                backdrop.style.transition = 'opacity 0.3s ease';
                backdrop.addEventListener('click', () => {
                    sidebar.classList.remove('open');
                    backdrop.style.opacity = '0';
                    setTimeout(() => backdrop.remove(), 300);
                });
                document.body.appendChild(backdrop);
                // Force reflow
                backdrop.offsetHeight;
                backdrop.style.opacity = '1';
            } else {
                backdrop.style.opacity = '0';
                setTimeout(() => backdrop.remove(), 300);
            }
        }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
